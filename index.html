<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jeet &amp; Bhavini · 1–2 December 2026</title>
<meta name="description" content="Jeet Jabuvani weds Bhavini Nakrani — 1st and 2nd December 2026. Our events, our families, and your invitation.">
<meta name="theme-color" content="#F2F1ED">

<meta property="og:type" content="website">
<meta property="og:title" content="Jeet &amp; Bhavini · 1–2 December 2026">
<meta property="og:description" content="With the blessings of the divine, we request the honour of your presence.">
<meta property="og:image" content="assets/photos/couple-beach-01.jpg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400;500&family=Noto+Serif+Gujarati:wght@400;500;600&family=Rasa:wght@500;600;700&family=Great+Vibes&family=Mogra&family=Playfair+Display:ital,wght@1,400;1,500;1,600&family=DM+Serif+Display:ital@0;1&display=swap">
<!-- ?v= is bumped whenever styles.css or a generated asset changes; this
     site is edited in place with no build step, and browsers hold on to
     both the stylesheet and the PNGs otherwise. -->
<link rel="stylesheet" href="styles.css?v=20260918c">
</head>
<body>

<!-- ==== inline SVG library ============================================== -->
<svg width="0" height="0" aria-hidden="true" style="position:absolute">
  <defs>

    <!-- tapered rule with a lotus medallion -->
    <g id="orn-rule">
      <g stroke="currentColor" stroke-width="1" stroke-linecap="round" opacity=".7" fill="none">
        <path d="M8 12h122"/><path d="M190 12h122"/>
        <path d="M2 12l3-2.2 3 2.2-3 2.2z" fill="currentColor" stroke="none"/>
        <path d="M318 12l-3-2.2-3 2.2 3 2.2z" fill="currentColor" stroke="none"/>
      </g>
      <g transform="translate(160 12)">
        <path d="M0-7.5c2.6 2.1 3.9 4.6 3.9 7.5C3.9 2.9 2.6 5.4 0 7.5c-2.6-2.1-3.9-4.6-3.9-7.5 0-2.9 1.3-5.4 3.9-7.5z" fill="var(--rose)" opacity=".85"/>
        <path d="M-4.4-4.1C-1.7-3.3.2-1.7 1.2.6 2.2 2.9 2.1 5.3 1 7.4c-2.7-.8-4.6-2.4-5.6-4.7C-5.6.4-5.5-2-4.4-4.1z" fill="var(--rose)" opacity=".5"/>
        <path d="M4.4-4.1C5.5-2 5.6.4 4.6 2.7 3.6 5 1.7 6.6-1 7.4c-1.1-2.1-1.2-4.5-.2-6.8C-.2-1.7 1.7-3.3 4.4-4.1z" fill="var(--rose)" opacity=".5"/>
        <circle r="1.15" fill="var(--brass)"/>
      </g>
    </g>

    <!-- Photo-frame corner filigree, drawn in a 40-box. The frame's borders
         and beading are CSS on .gallery__frame; only the corners are drawn
         here, so the filigree never stretches with the stage's aspect. -->
    <g id="orn-frame-corner" fill="none">
      <path d="M0 26c0-14 12-26 26-26" stroke="currentColor" stroke-width="1.4"/>
      <path d="M6 30c0-13 11-24 24-24" stroke="currentColor" stroke-width=".7" opacity=".55"/>
      <path d="M13 13c5-6 12-8 19-6-6 1-11 4-14 8-3 4-4 9-3 14-3-6-3-12-2-16z" fill="currentColor" opacity=".5"/>
      <circle cx="26" cy="26" r="1.6" fill="currentColor"/>
    </g>

    <!-- essentials + control icons, 24-box, stroked -->
    <g id="ic-cal" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3.5" y="5" width="17" height="16" rx="2"/>
      <path d="M8 3v4M16 3v4M3.5 10h17"/>
    </g>
    <g id="ic-music" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/>
    </g>
    <g id="ic-mute" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/>
      <path d="M3 3l18 18"/>
    </g>
    <g id="ic-top" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 19V6M6 12l6-6 6 6"/>
    </g>
  </defs>
</svg>

<noscript>
  <div style="padding:2rem;text-align:center;font-family:Georgia,serif">
    <p>Please enable JavaScript to view the invitation.</p>
  </div>
</noscript>

<!-- ==== intro screen ===================================================
     The temple bell hangs from a floral arch, with the ceremonial elephant's
     trunk raised to it. The scene holds still until the visitor rings the
     bell; the trunk then strikes, the bell rocks, and the page opens.
     Art: scripts/gen_intro3.py. Geometry: styles.css. -->
<div class="intro" id="intro" role="dialog" aria-label="Opening the invitation">
  <div class="intro__scene">
    <!-- Everything below is a percentage of this one box, which is the
         painting's own frame - so there is a single coordinate system and the
         bell, chain and trunk cannot drift apart from the painting. -->
    <div class="intro__stage">
      <img class="intro__bg" src="assets/generated/intro3_plate.jpg?v=11"
           alt="A garden pavilion with a temple bell hanging in its archway">

      <!-- everything below here moves -->
      <div class="intro__chain" aria-hidden="true"></div>
      <img class="intro__bell" id="introBell" src="assets/generated/intro3_bellbody.png?v=11" alt="">

      <!-- The elephant rears to reach the bell, so all of it moves.
           .intro__ele tilts back on the hind legs; the legs and trunk are
           children, so they inherit that tilt and add their own on top. The
           body is a JPEG cut out by a mask rather than a transparent PNG - a
           quarter of the weight for the same picture. See bake_intro3.py. -->
      <div class="intro__ele">
        <div class="intro__eleBody" role="img"
             aria-label="A ceremonial elephant rearing to ring a temple bell"></div>
        <img class="intro__leg intro__leg--far"  src="assets/generated/intro3_leg_far.png?v=11"  alt="" aria-hidden="true">
        <img class="intro__leg intro__leg--near" src="assets/generated/intro3_leg_near.png?v=11" alt="" aria-hidden="true">
        <div class="intro__trunk" aria-hidden="true"></div>
      </div>
    </div>

    <!-- On the scene, not the stage: the stage overflows the width on a phone,
         and a cue centred on it would run off both edges. -->
    <p class="intro__cue" id="introCue">
      <span class="intro__cueTitle" id="introCueTitle"></span>
      <span class="intro__cueSub" id="introCueSub"></span>
    </p>
  </div>
</div>

<!-- ==== royal palace doors with cursive J & B initials ==================
     After the elephant rings the bell, these magnificent hand-carved royal
     palace doors are presented, bearing cursive gold J and B initials on a
     central seal. When triggered, the double doors swing open in 3D perspective,
     with J swinging left and B swinging right, directly revealing the garland page! -->
<div class="royal-door-stage" id="royalDoorStage" role="dialog" aria-label="Royal Palace Doors" hidden>
  <div class="royal-portal" id="royalPortal">
    <!-- Double swinging door leaves in 3D perspective -->
    <div class="royal-leaves-box" id="royalLeavesBox">
      <!-- Left Door Leaf -->
      <div class="royal-leaf royal-leaf--l" id="royalLeafL">
        <img class="royal-leaf__img" src="assets/generated/royal_door_left.png?v=5" alt="Left palace door">
      </div>

      <!-- Right Door Leaf -->
      <div class="royal-leaf royal-leaf--r" id="royalLeafR">
        <img class="royal-leaf__img" src="assets/generated/royal_door_right.png?v=5" alt="Right palace door">
      </div>
    </div>

    <!-- Outer Arch & Fluted Pillars Frame -->
    <img class="royal-portal__frame" src="assets/generated/royal_door_frame.png?v=5" alt="" aria-hidden="true">
  </div>
</div>

<!-- ==== language ====================================================== -->
<!-- Fixed to the top right, above everything, on every screen. Both
     languages sit in the toggle at once; the active one is filled. -->
<div class="topbar">
  <div class="langswitch" id="langSwitch" role="group"></div>
</div>

<main id="top">

  <!-- ==== hero ========================================================= -->
  <header class="hero" id="hero">
    <div class="deco garland deco--garland-a reveal reveal--drop"><img src="assets/generated/mogra_long.png"  alt="" data-par="0.16"></div>
    <div class="deco garland deco--garland-b reveal reveal--drop" style="--d:120ms"><img src="assets/generated/mogra_short.png" alt="" data-par="0.26"></div>
    <div class="deco garland deco--garland-c reveal reveal--drop" style="--d:60ms"><img src="assets/generated/mogra_long.png"  alt="" data-par="0.20"></div>
    <div class="deco garland deco--garland-d reveal reveal--drop" style="--d:180ms"><img src="assets/generated/mogra_short.png" alt="" data-par="0.30"></div>

    <div class="deco deco--palm-l reveal" style="--d:220ms"><img src="assets/generated/banana_palm_left.png"  alt="" data-par="-0.08"></div>
    <div class="deco deco--palm-r reveal" style="--d:280ms"><img src="assets/generated/banana_palm_right.png" alt="" data-par="-0.06"></div>

    <div class="deco deco--kalash   reveal" style="--d:340ms"><img src="assets/generated/brass_kalash.png"   alt=""></div>
    <div class="deco deco--lotus    reveal" style="--d:380ms"><img src="assets/generated/lotus_bowl.png"     alt=""></div>
    <div class="deco deco--elephant reveal" style="--d:420ms"><img src="assets/generated/brass_elephant.png" alt=""></div>

    <!-- Two birds hovering beside the names. Each is three frames sliced from
         one sprite sheet, played folded -> spread -> raised -> spread, which
         gives a real wingbeat rather than a twitch. -->
    <div class="bird bird--a" aria-hidden="true">
      <img class="wf wf1" src="assets/generated/bird_a_2.png" alt="">
      <img class="wf wf2" src="assets/generated/bird_a_3.png" alt="">
      <img class="wf wf3" src="assets/generated/bird_a_4.png" alt="">
    </div>
    <div class="bird bird--b" aria-hidden="true">
      <img class="wf wf1" src="assets/generated/bird_b_2.png" alt="">
      <img class="wf wf2" src="assets/generated/bird_b_3.png" alt="">
      <img class="wf wf3" src="assets/generated/bird_b_4.png" alt="">
    </div>

    <div class="hero__inner">
      <img class="hero__ganesha reveal" src="assets/generated/ganesha_motif.png" alt="Shri Ganesha">
      <p class="eyebrow reveal" id="heroEyebrow"></p>
      <h1 class="display hero__names reveal" style="--d:80ms" id="heroNames"></h1>
      <p class="gu hero__gu reveal" style="--d:160ms" id="heroGu"></p>
      <p class="hero__welcome reveal" style="--d:200ms" id="heroWelcome"></p>
      <span class="rule reveal" style="--d:220ms" aria-hidden="true">
        <svg viewBox="0 0 320 24"><use href="#orn-rule"/></svg>
      </span>
      <p class="hero__meta reveal" style="--d:280ms" id="heroMeta"></p>
      <span class="scroll-cue" id="scrollCue" aria-hidden="true"><span class="scroll-cue__label" id="scrollCueLabel"></span></span>
    </div>
  </header>

  <!-- ==== invitation =================================================== -->
  <section class="section invite" aria-labelledby="inviteName">
    <div class="invite__palace-card reveal">
      <div class="invite__palace-content">
        <p class="invite__shree">॥ श्री गणेशाय नमः ॥</p>
        <img class="invite__ganesha-motif" src="assets/generated/palace_ganesha.png" alt="Shri Ganesha">
        <p class="invite__shloka">
          वक्रतुण्ड महाकाय सूर्यकोटि समप्रभः ।<br>
          निर्विघ्नं कुरु मे देव सर्वकार्येषु सर्वदा ॥
        </p>
        <div id="invParties" class="invite__parties"></div>
      </div>
    </div>
  </section>

  <!-- ==== events ======================================================= -->
  <section class="section section--center events" id="events" aria-labelledby="eventsTitle">
    <div class="wrap">
      <p class="eyebrow reveal" id="eventsEyebrow"></p>
      <h2 class="section-title reveal" style="--d:80ms" id="eventsTitle"></h2>
      <p class="reveal" id="eventsAlt" style="--d:140ms;color:var(--ink-soft);margin:.4rem 0 0"></p>
      <span class="rule reveal" style="--d:200ms" aria-hidden="true">
        <svg viewBox="0 0 320 24"><use href="#orn-rule"/></svg>
      </span>
      <!-- Five separate cards, each rendered from its own entry in content.js.
           Deliberately not one composite image. -->
      <div class="events__list" id="eventsList"></div>
    </div>
  </section>

  <!-- ==== gallery ====================================================== -->
  <section class="section section--center gallery" id="gallery" aria-labelledby="galleryTitle">
    <div class="wrap">
      <h2 class="section-title reveal" id="galleryTitle"></h2>
      <p class="section-subtitle reveal" id="gallerySubtitle"></p>
      <span class="rule reveal" style="--d:120ms" aria-hidden="true">
        <svg viewBox="0 0 320 24"><use href="#orn-rule"/></svg>
      </span>
      <!-- A depth carousel: a focused centre print with the rest scaled
           down toward the edges, dragged or scrolled through. Built in
           main.js from the photos in content.js. -->
      <div class="depthcar" id="galleryStage">
        <div class="depthcar__track" id="galleryTrack" role="list"></div>
        <button class="depthcar__nav depthcar__nav--prev" id="galPrev" type="button"></button>
        <button class="depthcar__nav depthcar__nav--next" id="galNext" type="button"></button>
      </div>
      <p class="gallery__caption reveal" id="galleryCaption"></p>
    </div>
  </section>

  <!-- ==== closing half =================================================== -->
  <div class="closing" id="closing">
    <span class="closing__seam" aria-hidden="true"></span>

    <!-- Save the date: the wedding month with its days marked. Month, weekday
         heads and marked days are all built in main.js from the dates in
         content.js, so this cannot drift from the cards. -->
    <section class="section savedate" id="savedate">
      <div class="wrap--narrow">
        <figure class="cal reveal">
          <div class="cal__top-banner" aria-hidden="true">
            <img src="assets/generated/cal_top_border_clean.png" alt="">
          </div>
          <div class="cal__body">
            <figcaption class="cal__month" id="calMonth"></figcaption>
            <div class="cal__grid" id="calGrid"></div>
            <div class="cal__meta" id="calMeta">
              <p class="cal__venue-line">
                <span class="cal__pin" aria-hidden="true">📍</span>
                <span class="cal__venue-name">OLEANDER FARMS</span>
              </p>
              <p class="cal__city-line" id="calCityLine">Karjat, Maharashtra</p>
              <div class="cal__divider" aria-hidden="true"></div>
              <p class="cal__regards-title" id="calRegardsTitle">Warm Regards</p>
              <p class="cal__family" id="calFamily">Jabuvani &amp; Nakrani Family</p>
              <div class="cal__leaf-orn" aria-hidden="true">
                <svg width="24" height="14" viewBox="0 0 24 14" fill="#B38B4D" opacity=".85"><path d="M12 7c-2-3-5-4-8-3 2 3 4 5 8 3zm0 0c2-3 5-4 8-3-2 3-4 5-8 3zm0 0v5"/></svg>
              </div>
            </div>
          </div>
          <div class="cal__foot">
            <img class="cal__garden-art" src="assets/generated/cal_elephant_garden_clean.png" alt="" loading="lazy">
          </div>
        </figure>
      </div>
    </section>

    <section class="section countdown" id="countdown" aria-labelledby="cdTitle">
      <div class="wrap">
        <h2 class="countdown__title reveal" id="cdTitle"></h2>
        <span class="rule reveal" style="--d:100ms" aria-hidden="true">
          <svg viewBox="0 0 320 24"><use href="#orn-rule"/></svg>
        </span>
        <div class="countdown__grid reveal" style="--d:220ms" id="cdGrid" role="timer" aria-live="off"></div>

        <div class="signoff reveal" style="--d:300ms">
          <span class="rule" aria-hidden="true"><svg viewBox="0 0 320 24"><use href="#orn-rule"/></svg></span>
          <p class="signoff__names" id="signoffNames"></p>
          <p class="signoff__date"  id="signoffDate"></p>
          <p class="signoff__line"  id="signoffLine"></p>
        </div>
      </div>
    </section>

    <!-- ==== families ===================================================== -->
    <section class="section section--center families" id="families" aria-labelledby="familiesTitle">
      <div class="wrap">
        <p class="eyebrow reveal" id="familiesEyebrow"></p>
        <h2 class="section-title reveal" style="--d:80ms" id="familiesTitle"></h2>
        <span class="rule reveal" style="--d:160ms" aria-hidden="true">
          <svg viewBox="0 0 320 24"><use href="#orn-rule"/></svg>
        </span>
        <div id="hostsPaired" class="hosts"></div>
        <div id="hostsAwaiting" class="hosts"></div>
      </div>
    </section>

    <section class="compliments" id="compliments" aria-labelledby="compHeading">
      <p class="compliments__heading" id="compHeading"></p>
      <div class="compliments__list" id="compList"></div>
    </section>

    <footer class="footer" id="footer"></footer>
  </div>
</main>

<!-- ==== event detail dialog ============================================ -->
<div class="evdlg" id="evdlg" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="evdlg__sheet" id="evdlgSheet">
    <button class="evdlg__close" id="evdlgClose" type="button" aria-label="Close">&times;</button>
    <div id="evdlgBody"></div>
  </div>
</div>

<!-- ==== floating controls ============================================== -->
<div class="controls">
  <button class="ctrl" id="musicBtn" type="button" aria-pressed="false" aria-label="Play music" title="Music">
    <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-mute" id="musicIcon"/></svg>
  </button>
  <button class="ctrl" id="topBtn" type="button" aria-label="Back to top" title="Back to top">
    <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-top"/></svg>
  </button>
</div>

<script src="content.js?v=20260916i"></script>
<script src="main.js?v=20260918c"></script>
</body>
</html>
